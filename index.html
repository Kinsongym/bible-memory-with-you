<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聖經背誦挑戰 App</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-light: #eff6ff;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --success-color: #16a34a;
            --accent-color: #d97706;
            --danger-color: #dc2626;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px 16px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .app-card {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        header { text-align: center; margin-bottom: 16px; }
        h1 { font-size: 1.4rem; color: var(--text-main); margin: 0 0 6px 0; font-weight: 700; }

        /* 排行榜資訊看板 */
        .dashboard-card {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 12px 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }
        .dashboard-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .rank-box {
            background: var(--bg-color);
            padding: 8px 10px;
            border-radius: 10px;
            font-size: 0.8rem;
        }
        .rank-box h4 {
            margin: 0 0 4px 0;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .rank-list {
            margin: 0;
            padding-left: 16px;
            color: var(--text-muted);
        }
        .rank-list li {
            margin-bottom: 3px;
            cursor: pointer;
            transition: color 0.2s;
        }
        .rank-list li:hover {
            color: var(--primary-color);
            text-decoration: underline;
        }

        .tab-group {
            display: flex; background: #f1f5f9; padding: 4px;
            border-radius: 12px; margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1; padding: 10px; border: none; background: none; font-weight: 600;
            font-size: 0.9rem; color: var(--text-muted); border-radius: 8px; cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: #ffffff; color: var(--primary-color);
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        .select-group { margin-bottom: 16px; }
        select, .timer-select {
            width: 100%; padding: 12px 16px; border: 1px solid var(--border-color);
            border-radius: 12px; font-size: 1rem; outline: none;
            background-color: var(--primary-light); color: var(--text-main); font-weight: 600;
        }

        .info-card {
            background-color: #f1f5f9; padding: 12px 16px; border-radius: 12px;
            margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center;
        }

        .verse-title-box { display: flex; align-items: center; gap: 8px; }
        .verse-title { font-size: 1rem; font-weight: 700; color: var(--primary-color); }
        .heart-btn {
            cursor: pointer; font-size: 1.2rem; user-select: none; transition: transform 0.2s;
        }
        .heart-btn:hover { transform: scale(1.2); }

        .stats-badge { font-size: 0.85rem; color: var(--text-muted); }
        .stats-badge span { font-weight: 700; color: var(--accent-color); }

        .btn-group { display: flex; gap: 10px; margin-bottom: 16px; }
        .btn-action {
            flex: 1; padding: 12px; font-size: 0.9rem; font-weight: 600;
            border-radius: 12px; border: 1px solid var(--border-color);
            background-color: #ffffff; color: var(--text-main); cursor: pointer;
        }
        .btn-action.active {
            background-color: var(--primary-color); color: white; border-color: var(--primary-color);
        }

        .bible-display {
            font-size: 1.15rem; line-height: 2.2; letter-spacing: 0.05em;
            min-height: 120px; word-break: break-all; padding: 18px;
            border-radius: 14px; background: #ffffff; border: 1.5px dashed var(--border-color);
        }

        .btn-play {
            width: 100%; padding: 14px; background: var(--success-color); color: white;
            font-size: 1.1rem; font-weight: 700; border: none; border-radius: 12px;
            cursor: pointer; margin-top: 12px;
        }

        .btn-next {
            width: 100%; padding: 14px; background: var(--primary-color); color: white;
            font-size: 1rem; font-weight: 700; border: none; border-radius: 12px; cursor: pointer;
            margin-top: 16px; display: none; animation: popIn 0.3s ease;
        }

        .btn-skip {
            width: 100%; padding: 10px; background: transparent; color: var(--text-muted);
            font-size: 0.9rem; font-weight: 600; border: 1px solid var(--border-color);
            border-radius: 10px; cursor: pointer; margin-top: 10px; transition: all 0.2s;
        }
        .btn-skip:hover { background: #f1f5f9; color: var(--text-main); }

        .feedback-msg {
            text-align: center; color: var(--success-color); font-weight: 700;
            font-size: 1.1rem; margin-top: 12px; display: none; animation: popIn 0.3s ease;
        }

        .timer-display {
            font-size: 1.2rem; font-weight: 800; color: var(--danger-color); text-align: center; margin-bottom: 12px;
        }

        .inline-char-input {
            width: 2em; height: 1.5em; text-align: center; font-size: 1.1rem; font-weight: 700;
            border: none; border-bottom: 2.5px solid var(--primary-color); background: #f1f5f9;
            color: var(--primary-color); outline: none; border-radius: 4px; margin: 0 2px;
            vertical-align: baseline; transition: all 0.2s;
        }

        .inline-num-input {
            width: 2.3em; height: 1.4em; text-align: center; font-size: 0.95rem; font-weight: 700;
            border: none; border-bottom: 2px solid var(--accent-color); background: #ffffff;
            color: var(--accent-color); outline: none; border-radius: 4px; margin: 0 2px;
        }

        .inline-char-input:focus, .inline-num-input:focus {
            background: var(--primary-light); box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
        }

        .inline-char-input.correct, .inline-num-input.correct {
            border-bottom-color: var(--success-color) !important;
            background: #f0fdf4 !important; color: var(--success-color) !important;
        }

        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

        @keyframes popIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        footer { margin-top: 20px; text-align: center; font-size: 0.78rem; color: #94a3b8; }
    </style>
</head>
<body>

<div class="app-card">
    <header>
        <h1>聖經背誦挑戰 App</h1>
    </header>

    <!-- 📊 首頁即時排行榜 -->
    <div class="dashboard-card">
        <div class="dashboard-title">
            <span>🔥 社群統計排行榜</span>
            <span style="font-size:0.75rem; font-weight:normal; color:var(--text-muted);">(點擊可直接練習)</span>
        </div>
        <div class="dashboard-grid">
            <div class="rank-box">
                <h4 style="color: var(--danger-color);">🔴 最常答錯 Top 5</h4>
                <ol class="rank-list" id="globalWrongRank"><li>尚無數據</li></ol>
            </div>
            <div class="rank-box">
                <h4 style="color: var(--accent-color);">❤️ 最喜愛經文 Top 5</h4>
                <ol class="rank-list" id="globalFavRank"><li>尚無數據</li></ol>
            </div>
        </div>
    </div>

    <div class="tab-group">
        <button class="tab-btn active" id="tabPractice" onclick="switchTab('practice')">📖 自由練習</button>
        <button class="tab-btn" id="tabGame" onclick="switchTab('game')">⏱️ 遊戲計時 Play</button>
    </div>

    <!-- ================= 模式一：自由練習模式 ================= -->
    <div id="practiceView">
        <div class="select-group">
            <select id="verseSelect" onchange="onSelectVerse()"></select>
        </div>
        <div class="info-card">
            <div class="verse-title-box">
                <span class="verse-title" id="practiceVerseTitle">--</span>
                <span class="heart-btn" id="practiceHeart" onclick="toggleFavorite()">🤍</span>
            </div>
            <div class="stats-badge"><span id="charCount">0</span> 字 | <span id="punctCount">0</span> 標點</div>
        </div>
        <div class="btn-group">
            <button id="btnRandom" class="btn-action active" onclick="setMode('random')">隨機填空打字</button>
            <button id="btnFull" class="btn-action" onclick="setMode('full')">顯示全文</button>
        </div>

        <div class="bible-display" id="displayText"></div>

        <div class="feedback-msg" id="practiceFeedback">🎉 非常好！再來一句吧！</div>
        <button class="btn-next" id="btnPracticeNext" onclick="loadRandomPracticeVerse()">Next 下一句 ➔ (Enter)</button>
        <button class="btn-skip" id="btnPracticeSkip" onclick="loadRandomPracticeVerse()">Skip 練習下一句 ↷</button>
    </div>

    <!-- ================= 模式二：遊戲計時模式 ================= -->
    <div id="gameView" style="display: none;">
        <div id="gameSetup" style="text-align: center;">
            <label style="display:block; margin-bottom: 8px; font-weight: 600;">選擇倒數時間：</label>
            <select id="timeSelect" class="timer-select">
                <option value="1">1 分鐘快答挑戰</option>
                <option value="2">2 分鐘背誦挑戰</option>
                <option value="3">3 分鐘背誦挑戰</option>
                <option value="5">5 分鐘背誦挑戰</option>
            </select>
            <button class="btn-play" onclick="startGame()">開始 Play 🚀</button>
        </div>

        <div id="gamePlay" style="display: none;">
            <div class="timer-display">⏳ 剩餘時間：<span id="timerText">01:00</span></div>
            <div class="info-card">
                <div class="verse-title" id="gameVerseTitle">--</div>
                <div class="stats-badge">已答對 <span id="scoreCount">0</span> 句</div>
            </div>

            <div class="bible-display" id="gameVerseText"></div>

            <button class="btn-next" id="btnGameNext" onclick="nextQuestion()">完全正確！Next 下一句 ➔ (Enter)</button>
            <button class="btn-skip" id="btnGameSkip" onclick="skipQuestion()">Skip 往下一句 ↷</button>
        </div>

        <div id="gameResult" style="display: none; text-align: center;">
            <h2 style="color: var(--primary-color);">🎉 時間到！挑戰完成</h2>
            <p style="font-size: 1.15rem; margin: 12px 0; line-height: 1.6;">
                你在 <strong id="finalTime" style="color: var(--primary-color);">1</strong> 分鐘內一共答對了：<br>
                <strong id="finalScore" style="font-size: 2.6rem; color: var(--success-color);">0</strong> 句經文！
            </p>
            <button class="btn-play" onclick="resetGameSetup()">再玩一次 🔄</button>
        </div>
    </div>

    <footer>
        Adm 可在原始碼 adminDatabase 自由擴充經文。
    </footer>
</div>

<script>
    const adminDatabase = {

        "馬太福音 6:33": "你們要先求祂的國和祂的義，這些東西都要加給你們了。",

        "馬太福音 22:37-39": "耶穌對他說：「你要盡心、盡性、盡意愛主——你的上帝。這是誡命中的第一，且是最大的。其次也相倣，就是要愛人如己。",
        "馬太福音 28:19-20": "所以，你們要去，使萬民作我的門徒，奉父、子、聖靈的名給他們施洗。凡我所吩咐你們的，都教訓他們遵守，我就常與你們同在，直到世界的末了。",
        "約翰福音 1:1": "太初有道，道與上帝同在，道就是上帝。",
        "約翰福音 1:12": "凡接待他的，就是信他名的人，他就賜他們權柄，作上帝的兒女。",
        "約翰福音 1:14": "道成了肉身，住在我們中間，充充滿滿地有恩典、有真理。我們也見過他的榮光，正是父獨生子的榮光。",

        "羅馬書 1:16": "我不以福音為恥；這福音本是上帝的大能，要救一切相信的，先是猶太人，後是希臘人。",
        "羅馬書 3:23": "因為世人都犯了罪，虧缺了上帝的榮耀；",

        "羅馬書 10:9": "你若口裏認耶穌為主，心裏信上帝叫祂從死裏復活，就必得救。",

        "以弗所書 2:8-9": "你們得救是本乎恩，也因著信；這並不是出於自己，乃是上帝所賜的；也不是出於行為，免得有人自誇。",
        "腓立比書 2:3-4": "凡事不可結黨，不可貪圖虛浮的榮耀，只要存心謙卑，各人看別人比自己強。各人不要單顧自己的事，也要顧別人的事。",
        "歌羅西書 1:28": "我們傳揚他，是用諸般的智慧勸誡各人，教導各人，要把各人在基督裡完完全全地引到上帝面前。",
        "提摩太後書 3:16-17": "聖經都是上帝所默示的，於教訓、督責、使人歸正、教導人學義，都是有益的，叫屬上帝的人得以完全，預備行各樣的善事。",
        "希伯來書 11:6": "人非有信，就不能得上帝的喜悅；因為到上帝面前來的人，必須信有上帝，且信他賞賜那尋求他的人。",
        "彼得前書 2:9": "唯有你們是被揀選的族類，是有君尊的祭司，是聖潔的國度，是屬上帝的子民，要叫你們宣揚那召你們出黑暗、入奇妙光明者的美德。",
        "約翰一書 1:8-9": "我們若說自己無罪，便是自欺，真理不在我們心裡了。我們若認自己的罪，上帝是信實的，是公義的，必要赦免我們的罪，洗淨我們一切的不義。",
        "約翰一書 2:15-16": "不要愛世界和世界上的事。人若愛世界，愛父的心就不在他裡面了。 因為凡世界上的事，就像肉體的情慾、眼目的情慾，並今生的驕傲，都不是從父來的，乃是從世界來的。"
    };

    const punctRegex = /[，。；：！？、「」『』（）…—\s\,\\.\\!\\?]/;

    function normalizeChar(c) {
        if (!c) return "";
        if (c === '裡') return '裏';
        if (c === '著') return '着';
        return c;
    }

    let defaultWrongStats = { "馬太福音 22:37-39": 5, "約翰一書 2:15-16": 4, "腓立比書 2:3-4": 3, "提摩太後書 3:16-17": 3, "加拉太書 5:22-23": 2 };
    let defaultFavStats = { "約翰福音 3:16": 8, "箴言 3:5-6": 6, "羅馬書 8:28": 5, "詩篇 119:11": 4, "馬太福音 6:33": 4 };

    let wrongStats = JSON.parse(localStorage.getItem('bible_wrong_stats')) || defaultWrongStats;
    let favStats = JSON.parse(localStorage.getItem('bible_fav_stats')) || defaultFavStats;
    let favorites = JSON.parse(localStorage.getItem('bible_favorites')) || ["約翰福音 3:16", "箴言 3:5-6"];

    window.onload = function() {
        populateVerseSelect();
        updateDashboard();
        loadRandomPracticeVerse();

        // ⌨️ 全域按鍵監聽：當出現 Next 按鈕時，按下 Enter 鍵可直接跳下一題並自動聚焦
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const practiceNextBtn = document.getElementById('btnPracticeNext');
                const gameNextBtn = document.getElementById('btnGameNext');

                if (practiceNextBtn && practiceNextBtn.style.display !== 'none') {
                    e.preventDefault();
                    loadRandomPracticeVerse();
                } else if (gameNextBtn && gameNextBtn.style.display !== 'none') {
                    e.preventDefault();
                    nextQuestion();
                }
            }
        });
    };

    // 🎯 自動聚焦通用函式：自動尋找目前模式中的第一個輸入框並停入游標
    function focusFirstInput(mode = 'practice') {
        setTimeout(() => {
            const prefix = mode === 'practice' ? 'prac' : 'game';
            const numInputs = mode === 'practice' ? practiceNumInputsData : gameNumInputsData;

            if (numInputs && numInputs.length > 0) {
                const el = document.getElementById(numInputs[0].id);
                if (el) el.focus();
            } else {
                const el = document.getElementById(`${prefix}CharInput_0`);
                if (el) el.focus();
            }
        }, 60);
    }

    function updateDashboard() {
        const topWrong = Object.entries(wrongStats).sort((a,b) => b[1] - a[1]).slice(0, 5);
        const wrongEl = document.getElementById('globalWrongRank');
        wrongEl.innerHTML = topWrong.length > 0 ? 
            topWrong.map(([k, v]) => `<li onclick="selectVerseDirectly('${k}')" title="點擊練習">${k}</li>`).join('') : '<li>尚無數據</li>';

        const topFav = Object.entries(favStats).sort((a,b) => b[1] - a[1]).slice(0, 5);
        const favEl = document.getElementById('globalFavRank');
        favEl.innerHTML = topFav.length > 0 ? 
            topFav.map(([k, v]) => `<li onclick="selectVerseDirectly('${k}')" title="點擊練習">${k}</li>`).join('') : '<li>尚無數據</li>';
    }

    function selectVerseDirectly(key) {
        switchTab('practice');
        document.getElementById("verseSelect").value = key;
        onSelectVerse();
    }

    function switchTab(tab) {
        document.getElementById('tabPractice').classList.toggle('active', tab === 'practice');
        document.getElementById('tabGame').classList.toggle('active', tab === 'game');
        document.getElementById('practiceView').style.display = tab === 'practice' ? 'block' : 'none';
        document.getElementById('gameView').style.display = tab === 'game' ? 'block' : 'none';
        
        if (tab === 'game') {
            resetGameSetup();
        } else {
            focusFirstInput('practice');
        }
    }

    /* ================= 自由練習模式 ================= */
    let currentPracticeKey = "";
    let currentPracticeText = "";
    let practiceMode = "random";
    let practiceTargetAnswers = [];
    let practiceNumInputsData = [];
    let isComposing = false;

    function populateVerseSelect() {
        const selectEl = document.getElementById("verseSelect");
        selectEl.innerHTML = "";
        for (let key in adminDatabase) {
            let option = document.createElement("option");
            option.value = key;
            option.textContent = (favorites.includes(key) ? "❤️ " : "") + key;
            selectEl.appendChild(option);
        }
    }

    function loadRandomPracticeVerse() {
        const keys = Object.keys(adminDatabase);
        const randomKey = keys[Math.floor(Math.random() * keys.length)];
        document.getElementById("verseSelect").value = randomKey;
        onSelectVerse();
    }

    function onSelectVerse() {
        currentPracticeKey = document.getElementById("verseSelect").value;
        currentPracticeText = adminDatabase[currentPracticeKey];
        updateHeartUI();
        updateStats();
        renderPracticeView();
    }

    function toggleFavorite() {
        if (favorites.includes(currentPracticeKey)) {
            favorites = favorites.filter(k => k !== currentPracticeKey);
            favStats[currentPracticeKey] = Math.max(0, (favStats[currentPracticeKey] || 1) - 1);
        } else {
            favorites.push(currentPracticeKey);
            favStats[currentPracticeKey] = (favStats[currentPracticeKey] || 0) + 1;
        }
        localStorage.setItem('bible_favorites', JSON.stringify(favorites));
        localStorage.setItem('bible_fav_stats', JSON.stringify(favStats));
        
        updateHeartUI();
        populateVerseSelect();
        document.getElementById("verseSelect").value = currentPracticeKey;
        updateDashboard();
    }

    function updateHeartUI() {
        const heartEl = document.getElementById("practiceHeart");
        heartEl.innerText = favorites.includes(currentPracticeKey) ? "❤️" : "🤍";
    }

    function updateStats() {
        let charCount = 0, punctCount = 0;
        for (let char of currentPracticeText) {
            punctRegex.test(char) ? punctCount++ : charCount++;
        }
        document.getElementById("charCount").innerText = charCount;
        document.getElementById("punctCount").innerText = punctCount;
    }

    function setMode(mode) {
        practiceMode = mode;
        document.getElementById('btnRandom').classList.toggle('active', mode === 'random');
        document.getElementById('btnFull').classList.toggle('active', mode === 'full');
        renderPracticeView();
    }

    function renderPracticeView() {
        document.getElementById('practiceFeedback').style.display = 'none';
        document.getElementById('btnPracticeNext').style.display = 'none';
        document.getElementById('btnPracticeSkip').style.display = 'block';

        if (practiceMode === 'full') {
            document.getElementById('practiceVerseTitle').innerText = currentPracticeKey;
            document.getElementById('btnPracticeSkip').style.display = 'none';
            let html = "";
            for (let char of currentPracticeText) {
                if (punctRegex.test(char)) html += `<span style="color:var(--text-muted);">${char}</span>`;
                else html += char;
            }
            document.getElementById('displayText').innerHTML = html;
            return;
        }

        practiceNumInputsData = [];
        let titleHtml = "";
        
        const spaceIdx = currentPracticeKey.search(/\s\d/);
        if (spaceIdx !== -1) {
            const bookName = currentPracticeKey.substring(0, spaceIdx);
            const numPart = currentPracticeKey.substring(spaceIdx).trim();
            const tokens = numPart.split(/(\d+)/);
            let numIndices = [];
            tokens.forEach((token, idx) => { if (/^\d+$/.test(token)) numIndices.push(idx); });

            let countToHide = Math.floor(Math.random() * numIndices.length) + 1;
            let hiddenIndices = [...numIndices].sort(() => 0.5 - Math.random()).slice(0, countToHide);

            titleHtml = bookName + " ";
            let numCounter = 0;

            tokens.forEach((token, idx) => {
                if (/^\d+$/.test(token)) {
                    if (hiddenIndices.includes(idx)) {
                        const inputId = `pracNumInput_${numCounter}`;
                        titleHtml += `<input type="number" class="inline-num-input" id="${inputId}" autocomplete="off" data-expected="${token}">`;
                        practiceNumInputsData.push({ id: inputId, expected: token });
                        numCounter++;
                    } else titleHtml += token;
                } else titleHtml += token;
            });
        } else { titleHtml = currentPracticeKey; }

        document.getElementById('practiceVerseTitle').innerHTML = titleHtml;

        let validCharIndices = [];
        for (let i = 0; i < currentPracticeText.length; i++) {
            if (!punctRegex.test(currentPracticeText[i])) validCharIndices.push(i);
        }

        let shuffled = [...validCharIndices].sort(() => 0.5 - Math.random());
        let countToPick = Math.min(10, validCharIndices.length);
        let targetIndices = shuffled.slice(0, countToPick).sort((a, b) => a - b);

        practiceTargetAnswers = targetIndices.map(idx => currentPracticeText[idx]);

        let gameHtml = "";
        let inputCounter = 0;

        for (let i = 0; i < currentPracticeText.length; i++) {
            const char = currentPracticeText[i];
            if (punctRegex.test(char)) {
                gameHtml += `<span style="color:var(--text-muted);">${char}</span>`;
            } else if (targetIndices.includes(i)) {
                gameHtml += `<input type="text" class="inline-char-input" id="pracCharInput_${inputCounter}" autocomplete="off">`;
                inputCounter++;
            } else { gameHtml += char; }
        }

        document.getElementById('displayText').innerHTML = gameHtml;
        bindPracticeInputEvents(inputCounter);

        // 🎯 載入後自動聚焦第一個空格
        focusFirstInput('practice');
    }

    function bindPracticeInputEvents(totalCharInputs) {
        practiceNumInputsData.forEach((item, idx) => {
            const el = document.getElementById(item.id);
            if (!el) return;

            el.addEventListener('input', () => {
                if (el.value.length >= item.expected.length) {
                    if (idx < practiceNumInputsData.length - 1) {
                        const nextEl = document.getElementById(practiceNumInputsData[idx + 1].id);
                        if (nextEl) nextEl.focus();
                    } else {
                        const firstCharEl = document.getElementById('pracCharInput_0');
                        if (firstCharEl) firstCharEl.focus();
                    }
                }
                checkPracticeAnswer(totalCharInputs);
            });

            el.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && el.value === '' && idx > 0) {
                    const prevEl = document.getElementById(practiceNumInputsData[idx - 1].id);
                    if (prevEl) prevEl.focus();
                }
            });
        });

        for (let i = 0; i < totalCharInputs; i++) {
            const el = document.getElementById(`pracCharInput_${i}`);
            if (!el) continue;

            el.addEventListener('compositionstart', () => { isComposing = true; });
            el.addEventListener('compositionend', (e) => {
                isComposing = false;
                handlePracticeCharInput(i, e.target, totalCharInputs);
            });
            el.addEventListener('input', (e) => {
                if (!isComposing) handlePracticeCharInput(i, e.target, totalCharInputs);
            });
            el.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && el.value === '') {
                    if (i > 0) {
                        document.getElementById(`pracCharInput_${i - 1}`).focus();
                    } else if (i === 0 && practiceNumInputsData.length > 0) {
                        const lastNumEl = document.getElementById(practiceNumInputsData[practiceNumInputsData.length - 1].id);
                        if (lastNumEl) lastNumEl.focus();
                    }
                }
            });
        }
    }

    function handlePracticeCharInput(index, inputEl, totalCharInputs) {
        if (inputEl.value.length > 0) {
            inputEl.value = inputEl.value.slice(-1);
            if (index < totalCharInputs - 1) {
                document.getElementById(`pracCharInput_${index + 1}`).focus();
            }
        }
        checkPracticeAnswer(totalCharInputs);
    }

    function checkPracticeAnswer(totalCharInputs) {
        let isAllCorrect = true;

        for (let item of practiceNumInputsData) {
            const el = document.getElementById(item.id);
            if (!el || el.value.trim() !== item.expected) { isAllCorrect = false; break; }
        }

        if (isAllCorrect) {
            for (let i = 0; i < totalCharInputs; i++) {
                const el = document.getElementById(`pracCharInput_${i}`);
                let val = el ? el.value.trim() : "";
                let expected = practiceTargetAnswers[i];
                if (normalizeChar(val) !== normalizeChar(expected)) { isAllCorrect = false; break; }
            }
        }

        if (isAllCorrect) {
            practiceNumInputsData.forEach(item => {
                const el = document.getElementById(item.id);
                if (el) el.classList.add('correct');
            });
            for (let i = 0; i < totalCharInputs; i++) {
                const el = document.getElementById(`pracCharInput_${i}`);
                if (el) el.classList.add('correct');
            }

            document.getElementById('practiceFeedback').style.display = 'block';
            document.getElementById('btnPracticeNext').style.display = 'block';
            document.getElementById('btnPracticeSkip').style.display = 'none';
        }
    }

    /* ================= 遊戲計時模式 ================= */
    let timer = null;
    let timeRemaining = 0;
    let chosenMinutes = 1; // 紀錄使用者選擇的分鐘數
    let score = 0;
    let gameTargetAnswers = [];
    let gameNumInputsData = [];
    let remainingVerseKeys = [];
    let currentGameKey = "";

    function resetGameSetup() {
        clearInterval(timer);
        document.getElementById('gameSetup').style.display = 'block';
        document.getElementById('gamePlay').style.display = 'none';
        document.getElementById('gameResult').style.display = 'none';
    }

    function startGame() {
        chosenMinutes = parseInt(document.getElementById('timeSelect').value);
        timeRemaining = chosenMinutes * 60;
        score = 0;
        document.getElementById('scoreCount').innerText = score;
        
        document.getElementById('gameSetup').style.display = 'none';
        document.getElementById('gamePlay').style.display = 'block';
        
        remainingVerseKeys = []; 
        startTimer();
        nextQuestion();
    }

    function startTimer() {
        updateTimerDisplay();
        timer = setInterval(() => {
            timeRemaining--;
            updateTimerDisplay();
            if (timeRemaining <= 0) {
                clearInterval(timer);
                endGame();
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        const m = Math.floor(timeRemaining / 60).toString().padStart(2, '0');
        const s = (timeRemaining % 60).toString().padStart(2, '0');
        document.getElementById('timerText').innerText = `${m}:${s}`;
    }

    function endGame() {
        document.getElementById('gamePlay').style.display = 'none';
        document.getElementById('gameResult').style.display = 'block';
        document.getElementById('finalTime').innerText = chosenMinutes; // 顯示答題時間
        document.getElementById('finalScore').innerText = score;        // 顯示答對題數
        updateDashboard();
    }

    function skipQuestion() {
        if (currentGameKey) {
            wrongStats[currentGameKey] = (wrongStats[currentGameKey] || 0) + 1;
            localStorage.setItem('bible_wrong_stats', JSON.stringify(wrongStats));
            updateDashboard();
        }
        nextQuestion();
    }

    function nextQuestion() {
        document.getElementById('btnGameNext').style.display = 'none';
        document.getElementById('btnGameSkip').style.display = 'block';

        if (remainingVerseKeys.length === 0) {
            remainingVerseKeys = Object.keys(adminDatabase);
        }

        const randomIndex = Math.floor(Math.random() * remainingVerseKeys.length);
        currentGameKey = remainingVerseKeys.splice(randomIndex, 1)[0];
        const fullText = adminDatabase[currentGameKey];

        gameNumInputsData = [];
        let titleHtml = "";
        
        const spaceIdx = currentGameKey.search(/\s\d/);
        if (spaceIdx !== -1) {
            const bookName = currentGameKey.substring(0, spaceIdx);
            const numPart = currentGameKey.substring(spaceIdx).trim();
            const tokens = numPart.split(/(\d+)/);
            let numIndices = [];
            tokens.forEach((token, idx) => { if (/^\d+$/.test(token)) numIndices.push(idx); });

            let countToHide = Math.floor(Math.random() * numIndices.length) + 1;
            let hiddenIndices = [...numIndices].sort(() => 0.5 - Math.random()).slice(0, countToHide);

            titleHtml = bookName + " ";
            let numCounter = 0;

            tokens.forEach((token, idx) => {
                if (/^\d+$/.test(token)) {
                    if (hiddenIndices.includes(idx)) {
                        const inputId = `gameNumInput_${numCounter}`;
                        titleHtml += `<input type="number" class="inline-num-input" id="${inputId}" autocomplete="off" data-expected="${token}">`;
                        gameNumInputsData.push({ id: inputId, expected: token });
                        numCounter++;
                    } else titleHtml += token;
                } else titleHtml += token;
            });
        } else { titleHtml = currentGameKey; }

        document.getElementById('gameVerseTitle').innerHTML = titleHtml;

        let validCharIndices = [];
        for (let i = 0; i < fullText.length; i++) {
            if (!punctRegex.test(fullText[i])) validCharIndices.push(i);
        }

        let shuffled = [...validCharIndices].sort(() => 0.5 - Math.random());
        let countToPick = Math.min(4, validCharIndices.length);
        let targetIndices = shuffled.slice(0, countToPick).sort((a, b) => a - b);

        gameTargetAnswers = targetIndices.map(idx => fullText[idx]);

        let gameHtml = "";
        let inputCounter = 0;

        for (let i = 0; i < fullText.length; i++) {
            const char = fullText[i];
            if (punctRegex.test(char)) {
                gameHtml += `<span style="color:var(--text-muted);">${char}</span>`;
            } else if (targetIndices.includes(i)) {
                gameHtml += `<input type="text" class="inline-char-input" id="gameCharInput_${inputCounter}" autocomplete="off">`;
                inputCounter++;
            } else { gameHtml += char; }
        }

        document.getElementById('gameVerseText').innerHTML = gameHtml;
        bindGameInputEvents(inputCounter);

        // 🎯 遊戲模式下一題：自動聚焦第一個空格
        focusFirstInput('game');
    }

    function bindGameInputEvents(totalCharInputs) {
        gameNumInputsData.forEach((item, idx) => {
            const el = document.getElementById(item.id);
            if (!el) return;

            el.addEventListener('input', () => {
                if (el.value.length >= item.expected.length) {
                    if (idx < gameNumInputsData.length - 1) {
                        const nextEl = document.getElementById(gameNumInputsData[idx + 1].id);
                        if (nextEl) nextEl.focus();
                    } else {
                        const firstCharEl = document.getElementById('gameCharInput_0');
                        if (firstCharEl) firstCharEl.focus();
                    }
                }
                checkGameAnswer(totalCharInputs);
            });

            el.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && el.value === '' && idx > 0) {
                    const prevEl = document.getElementById(gameNumInputsData[idx - 1].id);
                    if (prevEl) prevEl.focus();
                }
            });
        });

        for (let i = 0; i < totalCharInputs; i++) {
            const el = document.getElementById(`gameCharInput_${i}`);
            if (!el) continue;

            el.addEventListener('compositionstart', () => { isComposing = true; });
            el.addEventListener('compositionend', (e) => {
                isComposing = false;
                handleGameCharInput(i, e.target, totalCharInputs);
            });
            el.addEventListener('input', (e) => {
                if (!isComposing) handleGameCharInput(i, e.target, totalCharInputs);
            });
            el.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && el.value === '') {
                    if (i > 0) {
                        document.getElementById(`gameCharInput_${i - 1}`).focus();
                    } else if (i === 0 && gameNumInputsData.length > 0) {
                        const lastNumEl = document.getElementById(gameNumInputsData[gameNumInputsData.length - 1].id);
                        if (lastNumEl) lastNumEl.focus();
                    }
                }
            });
        }
    }

    function handleGameCharInput(index, inputEl, totalCharInputs) {
        if (inputEl.value.length > 0) {
            inputEl.value = inputEl.value.slice(-1);
            if (index < totalCharInputs - 1) {
                document.getElementById(`gameCharInput_${index + 1}`).focus();
            }
        }
        checkGameAnswer(totalCharInputs);
    }

    function checkGameAnswer(totalCharInputs) {
        let isAllCorrect = true;

        for (let item of gameNumInputsData) {
            const el = document.getElementById(item.id);
            if (!el || el.value.trim() !== item.expected) { isAllCorrect = false; break; }
        }

        if (isAllCorrect) {
            for (let i = 0; i < totalCharInputs; i++) {
                const el = document.getElementById(`gameCharInput_${i}`);
                let val = el ? el.value.trim() : "";
                let expected = gameTargetAnswers[i];
                if (normalizeChar(val) !== normalizeChar(expected)) { isAllCorrect = false; break; }
            }
        }

        if (isAllCorrect) {
            gameNumInputsData.forEach(item => {
                const el = document.getElementById(item.id);
                if (el) el.classList.add('correct');
            });
            for (let i = 0; i < totalCharInputs; i++) {
                const el = document.getElementById(`gameCharInput_${i}`);
                if (el) el.classList.add('correct');
            }

            score++;
            document.getElementById('scoreCount').innerText = score;
            document.getElementById('btnGameNext').style.display = 'block';
            document.getElementById('btnGameSkip').style.display = 'none';
        }
    }
</script>

</body>
</html>
